<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05050a" />
<title>點開的是傻逼</title>
<style>
  :root{
    --neon:#5cffc0;
    --violet:#b06bff;
    --cyan:#61e8ff;
    --pink:#ff4d7d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:#05050a;
    color:#fff;
    font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Heiti TC",system-ui,sans-serif;
    overflow:hidden;
    height:100dvh;
  }

  /* ===== 舞台 ===== */
  .scene{position:fixed;inset:0;overflow:hidden;display:grid;place-items:center;isolation:isolate;cursor:crosshair}

  /* 背景光束（沒有照片時也很有宇宙感） */
  .rays{
    position:absolute;inset:-45%;
    background:conic-gradient(from 0deg,
      #072b21,#5cffc0 7%,#08080f 17%,#6a2cff 27%,#08080f 38%,
      #61e8ff 49%,#08080f 60%,#5cffc0 71%,#120f22 82%,#b06bff 92%,#072b21);
    filter:blur(46px) saturate(1.35);
    opacity:.75;
    animation:spin 26s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* 主角照片：鋪滿整個畫面 */
  .photo{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center 42%;
    animation:drift 20s ease-in-out infinite alternate;
    will-change:transform;
  }
  @keyframes drift{
    from{transform:scale(1.03) translate3d(0,0,0)}
    to{transform:scale(1.11) translate3d(0,-1.2%,0)}
  }

  /* 暗角＋文字底 */
  .vignette{
    position:absolute;inset:0;z-index:1;
    background:
      radial-gradient(ellipse at 50% 46%, rgba(0,0,0,.05) 20%, rgba(0,0,0,.42) 66%, rgba(0,0,0,.86) 100%),
      linear-gradient(180deg, rgba(0,0,0,.62) 0%, rgba(0,0,0,0) 26%, rgba(0,0,0,0) 66%, rgba(0,0,0,.8) 100%);
  }

  /* ===== 上方小標 ===== */
  .badge{
    position:absolute;z-index:4;
    top:calc(16px + env(safe-area-inset-top));
    left:50%;transform:translateX(-50%);
    padding:.62em 1.25em;
    border-radius:999px;
    white-space:nowrap;
    font-size:clamp(.78rem,2.7vw,1rem);
    font-weight:900;
    letter-spacing:.2em;
    color:#fff;
    background:rgba(255,40,90,.18);
    border:1px solid rgba(255,90,130,.6);
    box-shadow:0 0 24px rgba(255,40,90,.4), inset 0 0 20px rgba(255,40,90,.2);
    -webkit-backdrop-filter:blur(8px);
    backdrop-filter:blur(8px);
    text-shadow:0 0 10px rgba(255,90,130,.95);
    animation:badgePulse 2.6s ease-in-out infinite;
  }
  @keyframes badgePulse{
    0%,100%{box-shadow:0 0 18px rgba(255,40,90,.3), inset 0 0 16px rgba(255,40,90,.16)}
    50%{box-shadow:0 0 34px rgba(255,40,90,.62), inset 0 0 24px rgba(255,40,90,.3)}
  }

  /* ===== 中間大字 ===== */
  .center{
    position:relative;z-index:3;
    text-align:center;
    padding:7vw 4vw;
    max-width:100%;
    animation:wobble 5s ease-in-out infinite;
  }
  .center::before{
    content:"";
    position:absolute;inset:-6% -4%;z-index:-1;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.52) 0%, rgba(0,0,0,.22) 55%, rgba(0,0,0,0) 78%);
    filter:blur(18px);
  }
  h1{
    font-size:clamp(2.5rem,11.5vw,8.6rem);
    line-height:1.05;
    font-weight:900;
    letter-spacing:.05em;
    color:#fff;
    text-shadow:
      0 0 6px rgba(255,255,255,.9),
      0 0 22px rgba(92,255,192,.85),
      0 0 60px rgba(92,255,192,.55),
      0 8px 0 rgba(0,0,0,.35);
    animation:glow 2.4s ease-in-out infinite;
  }
  h1 .hl{
    background:linear-gradient(100deg,#d8fff0 0%,#5cffc0 26%,#61e8ff 52%,#b06bff 82%,#ff8ad4 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    text-shadow:none;
    filter:drop-shadow(0 0 16px rgba(92,255,192,.8)) drop-shadow(0 0 40px rgba(176,107,255,.45));
  }
  @keyframes glow{
    0%,100%{filter:brightness(1)}
    50%{filter:brightness(1.18)}
  }
  @keyframes wobble{
    0%,100%{transform:rotate(-1.1deg) translateY(0)}
    50%{transform:rotate(1.1deg) translateY(-7px)}
  }

  .sub{
    margin-top:clamp(14px,3.4vw,28px);
    font-size:clamp(.85rem,3.4vw,1.15rem);
    font-weight:700;
    letter-spacing:.12em;
    color:rgba(255,255,255,.9);
    text-shadow:0 2px 10px rgba(0,0,0,.85);
  }
  .sub b{color:var(--neon);text-shadow:0 0 14px rgba(92,255,192,.85)}

  /* ===== 底部 ===== */
  .tip{
    position:absolute;z-index:4;
    bottom:calc(16px + env(safe-area-inset-bottom));
    left:50%;transform:translateX(-50%);
    width:100%;
    text-align:center;
    font-size:clamp(.7rem,2.6vw,.9rem);
    letter-spacing:.14em;
    color:rgba(255,255,255,.62);
    text-shadow:0 2px 8px #000;
    animation:blink 3.2s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:.45}50%{opacity:.95}}

  /* ===== 閃亮星塵 ===== */
  #sparkles{position:absolute;inset:0;z-index:2;pointer-events:none}
  .spark{
    position:absolute;
    width:var(--size);height:var(--size);
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 6px #fff,0 0 16px var(--neon);
    animation:twinkle var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0;transform:scale(.4)}
    45%{opacity:.95;transform:scale(1.2)}
  }

  /* ===== 點擊噴出小垃圾 ===== */
  .pop{
    position:fixed;z-index:60;pointer-events:none;
    transform:translate(-50%,-50%);
    will-change:transform,opacity;
    animation:pop 1.05s cubic-bezier(.2,.7,.3,1) forwards;
    filter:drop-shadow(0 2px 6px rgba(0,0,0,.6));
  }
  @keyframes pop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.35) rotate(0)}
    14%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(0)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.75) rotate(var(--rot))}
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>

    <div class="tip">點一下畫面，有東西會跑出來 🐾</div>
  </div>

<script>
  /* 星塵 */
  (function(){
    const layer = document.getElementById('sparkles');
    const rnd = (a,b)=>a+Math.random()*(b-a);
    for(let i=0;i<40;i++){
      const s = document.createElement('i');
      s.className = 'spark';
      s.style.left = rnd(0,100)+'%';
      s.style.top  = rnd(0,100)+'%';
      s.style.setProperty('--size', rnd(1,3.2).toFixed(1)+'px');
      s.style.setProperty('--d', rnd(2.4,7).toFixed(2)+'s');
      s.style.setProperty('--delay', rnd(-7,0).toFixed(2)+'s');
      layer.appendChild(s);
    }
  })();

  /* 點擊噴發 */
  (function(){
    const emojis = ['😼','🐱','✨','💥','🤡','🐾','😹','💫'];
    let last = 0;
    function burst(x,y){
      const now = performance.now();
      if(now - last < 90) return;
      last = now;
      for(let i=0;i<7;i++){
        const el = document.createElement('span');
        el.className = 'pop';
        el.textContent = emojis[(Math.random()*emojis.length)|0];
        el.style.left = x+'px';
        el.style.top  = y+'px';
        el.style.fontSize = (18+Math.random()*24)+'px';
        el.style.setProperty('--dx', ((Math.random()*2-1)*150).toFixed(0)+'px');
        el.style.setProperty('--dy', (-50-Math.random()*150).toFixed(0)+'px');
        el.style.setProperty('--rot', ((Math.random()*2-1)*100).toFixed(0)+'deg');
        document.body.appendChild(el);
        setTimeout(()=>el.remove(),1150);
      }
    }
    window.addEventListener('pointerdown', e=>burst(e.clientX,e.clientY), {passive:true});
  })();
</script>
</body>
</html>
